# Configuração isolada para execução de testes automatizados (H2 in-memory em modo MySQL)
spring.datasource.url=jdbc:h2:mem:sexta_feira_test_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Desativa schedulers durante testes
monitoramento.enabled=false
spring.task.scheduling.enabled=false

# URLs simuladas para testes
sexta.ia.url=http://127.0.0.1:8000
whatsapp.api.url=http://127.0.0.1:9999/mock-whatsapp
whatsapp.api.token=test-token
