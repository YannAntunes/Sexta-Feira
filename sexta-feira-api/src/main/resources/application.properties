# Porta padrão da API
server.port=${SERVER_PORT:8080}

# Configuração do banco de dados MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sexta_feira_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# URL do serviço de IA da SEXTA-FEIRA (Python)
sexta.ia.url=${SEXTA_IA_URL:http://127.0.0.1:8000}

# Timeouts HTTP (ms)
http.client.connect-timeout-ms=${HTTP_CONNECT_TIMEOUT_MS:5000}
http.client.read-timeout-ms=${HTTP_READ_TIMEOUT_MS:15000}

# Integrações Externas (Brapi / CoinGecko)
brapi.base-url=${BRAPI_BASE_URL:https://brapi.dev/api}
brapi.token=${BRAPI_TOKEN:}
coingecko.base-url=${COINGECKO_BASE_URL:https://api.coingecko.com/api/v3}

# WhatsApp API e Segurança do Webhook
whatsapp.api.url=${WHATSAPP_API_URL:https://exemplo-do-provedor.com/send}
whatsapp.api.token=${WHATSAPP_API_TOKEN:}
whatsapp.webhook.secret=${WHATSAPP_WEBHOOK_SECRET:}

# Monitoramento de Orçamentos
monitoramento.enabled=${MONITORAMENTO_ENABLED:true}
monitoramento.whatsapp.to=${MONITORAMENTO_WHATSAPP_TO:}
monitoramento.delay-ms=${MONITORAMENTO_DELAY_MS:600000}

# Usuário padrão apenas para chamadas locais sem cabeçalho X-User-Whatsapp
sexta.auth.default-whatsapp=${SEXTA_DEFAULT_WHATSAPP:local-dev-user}
sexta.auth.require-header=${SEXTA_AUTH_REQUIRE_HEADER:false}
